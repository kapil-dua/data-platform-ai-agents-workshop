# Databricks Asset Bundle — generated by scripts/setup.py
# Deploy with: databricks bundle deploy

bundle:
  name: etl_raw_to_cleansed_customers

variables:
  catalog:
    default: demo_etl

resources:
  jobs:
    etl_raw_to_cleansed_customers:
      name: etl_raw_to_cleansed_customers
      description: "Reads raw customer records, validates schema, deduplicates, writes to cleansed layer."

      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
        pause_status: PAUSED

      tasks:
        - task_key: main
          notebook_task:
            notebook_path: /Shared/demo_etl/etl_raw_to_cleansed_customers
            base_parameters:
              source_table: "demo_etl.raw.customers_raw"
              target_table: "demo_etl.cleansed.customers"
              primary_key: "customer_id"
              partition_col: "load_date"

      # Pipeline metadata — used by RCA agent for context
      tags:
        layer:            "raw_to_cleansed"
        upstream_system:  "CRM export (nightly)"
        source_table:     "demo_etl.raw.customers_raw"
        target_table:     "demo_etl.cleansed.customers"
        target_schema:    "demo_etl.cleansed"
        sla:              "03:00 UTC"
