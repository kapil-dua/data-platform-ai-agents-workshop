resources:
  jobs:
    etl_raw_to_cleansed_sales:
      name: etl_raw_to_cleansed_sales
      description: Reads raw sales transactions, applies business rules, writes to
        cleansed.sales_transactions.
      schedule:
        quartz_cron_expression: 0 0 2 * * ?
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
      - task_key: main
        notebook_task:
          notebook_path: /Shared/demo_etl/etl_raw_to_cleansed_sales
          base_parameters:
            source_table: demo_etl.raw.sales_raw
            target_schema: demo_etl.confromed_sales
            target_table: demo_etl.confromed_sales.sales_transactions
      tags:
        layer: raw_to_cleansed
        upstream_system: POS system (real-time CDC via Kafka → Delta)
        source_table: demo_etl.raw.sales_raw
        target_table: demo_etl.cleansed.sales_transactions
        target_schema: demo_etl.cleansed
        sla: 04:00 UTC
