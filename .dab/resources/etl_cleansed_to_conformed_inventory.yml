resources:
  jobs:
    etl_cleansed_to_conformed_inventory:
      name: etl_cleansed_to_conformed_inventory
      description: Aggregates cleansed inventory data into daily summary fact table.
      schedule:
        quartz_cron_expression: 0 0 2 * * ?
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
      - task_key: main
        notebook_task:
          notebook_path: /Shared/demo_etl/etl_cleansed_to_conformed_inventory
          base_parameters:
            source_table: demo_etl.cleansed.inventory_daily
            target_table: demo_etl.conformed.fact_inventory_summary
            aggregation: daily_by_warehouse
      tags:
        layer: cleansed_to_conformed
        upstream_system: cleansed.inventory_daily (internal)
        source_table: demo_etl.cleansed.inventory_daily
        target_table: demo_etl.conformed.fact_inventory_summary
        target_schema: demo_etl.conformed
        sla: 06:00 UTC
