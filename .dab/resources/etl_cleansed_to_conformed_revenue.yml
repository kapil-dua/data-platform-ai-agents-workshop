resources:
  jobs:
    etl_cleansed_to_conformed_revenue:
      name: etl_cleansed_to_conformed_revenue
      description: Reads cleansed revenue export, aggregates by region/product, writes
        to conformed.fact_revenue_daily.
      schedule:
        quartz_cron_expression: 0 0 2 * * ?
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
      - task_key: main
        notebook_task:
          notebook_path: /Shared/demo_etl/etl_cleansed_to_conformed_revenue
          base_parameters:
            source_path: abfss://raw@datalake.dfs.core.windows.net/finance/revenue/
            source_table: demo_etl.cleansed.revenue_export
            target_table: demo_etl.conformed.fact_revenue_daily
            filename_pattern: revenue_export_YYYY-MM-DD.csv
      tags:
        layer: cleansed_to_conformed
        upstream_system: Finance system revenue export (daily batch)
        source_table: demo_etl.cleansed.revenue_export
        target_table: demo_etl.conformed.fact_revenue_daily
        target_schema: demo_etl.conformed
        sla: 05:00 UTC
