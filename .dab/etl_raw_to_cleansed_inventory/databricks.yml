# Databricks Asset Bundle — generated by scripts/setup.py
# Deploy with: databricks bundle deploy

bundle:
  name: etl_raw_to_cleansed_inventory

variables:
  catalog:
    default: demo_etl

resources:
  jobs:
    etl_raw_to_cleansed_inventory:
      name: etl_raw_to_cleansed_inventory
      description: "Reads daily inventory CSV from ADLS, validates and writes to cleansed.inventory_daily."

      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
        pause_status: PAUSED

      tasks:
        - task_key: main
          notebook_task:
            notebook_path: /Shared/demo_etl/etl_raw_to_cleansed_inventory
            base_parameters:
              source_path: "abfss://raw@datalake.dfs.core.windows.net/inventory/daily/"
              target_table: "demo_etl.cleansed.inventory_daily"
              filename_pattern: "inventory_YYYY-MM-DD.csv"
              archive_path: "abfss://raw@datalake.dfs.core.windows.net/inventory/archive/"

      # Pipeline metadata — used by RCA agent for context
      tags:
        layer:            "raw_to_cleansed"
        upstream_system:  "Warehouse Management System (WMS) — SFTP drop at 01:00 UTC"
        source_table:     "demo_etl.raw.inventory_raw"
        target_table:     "demo_etl.cleansed.inventory_daily"
        target_schema:    "demo_etl.cleansed"
        sla:              "02:00 UTC"
