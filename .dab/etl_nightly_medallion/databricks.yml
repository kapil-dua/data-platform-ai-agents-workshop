# Databricks Asset Bundle — generated by scripts/setup.py
# Single pipeline covering the full medallion architecture
# Deploy with: databricks bundle deploy

bundle:
  name: etl_nightly_medallion

variables:
  catalog:
    default: demo_etl

resources:
  jobs:
    etl_nightly_medallion:
      name: etl_nightly_medallion
      description: "Nightly medallion ETL pipeline: raw → cleansed → conformed"

      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
        pause_status: PAUSED

      # ── Layer 1: Raw → Cleansed (runs in parallel) ──────────────────────
      tasks:
        - task_key: raw_to_cleansed_customers
          description: "Ingest raw customer records from CRM nightly export"
          notebook_task:
            notebook_path: /Shared/demo_etl/etl_raw_to_cleansed_customers
            base_parameters:
              source_table: "demo_etl.raw.customers_raw"
              target_table: "demo_etl.cleansed.customers"
              primary_key:  "customer_id"
              sla:          "03:00 UTC"

        - task_key: raw_to_cleansed_inventory
          description: "Ingest daily inventory CSV from WMS SFTP drop (01:00 UTC)"
          notebook_task:
            notebook_path: /Shared/demo_etl/etl_raw_to_cleansed_inventory
            base_parameters:
              source_path:      "abfss://raw@datalake.dfs.core.windows.net/inventory/daily/"
              target_table:     "demo_etl.cleansed.inventory_daily"
              filename_pattern: "inventory_YYYY-MM-DD.csv"
              archive_path:     "abfss://raw@datalake.dfs.core.windows.net/inventory/archive/"
              upstream_system:  "Warehouse Management System (WMS)"
              sla:              "02:00 UTC"

        - task_key: raw_to_cleansed_sales
          description: "Ingest raw POS sales transactions from Kafka CDC"
          notebook_task:
            notebook_path: /Shared/demo_etl/etl_raw_to_cleansed_sales
            base_parameters:
              source_table:  "demo_etl.raw.sales_raw"
              target_schema: "demo_etl.confromed_sales"
              target_table:  "demo_etl.confromed_sales.sales_transactions"
              upstream_system: "POS system (real-time CDC via Kafka)"
              sla:           "04:00 UTC"

        # ── Layer 2: Cleansed → Conformed (depends on Layer 1) ─────────────
        - task_key: cleansed_to_conformed_revenue
          description: "Aggregate revenue export into conformed fact table"
          depends_on:
            - task_key: raw_to_cleansed_sales
          notebook_task:
            notebook_path: /Shared/demo_etl/etl_cleansed_to_conformed_revenue
            base_parameters:
              source_path:      "abfss://raw@datalake.dfs.core.windows.net/finance/revenue/"
              source_table:     "demo_etl.cleansed.revenue_export"
              target_table:     "demo_etl.conformed.fact_revenue_daily"
              filename_pattern: "revenue_export_YYYY-MM-DD.csv"
              upstream_system:  "Finance system revenue export (daily batch)"
              sla:              "05:00 UTC"

        - task_key: cleansed_to_conformed_inventory
          description: "Aggregate cleansed inventory into daily summary fact"
          depends_on:
            - task_key: raw_to_cleansed_inventory
          notebook_task:
            notebook_path: /Shared/demo_etl/etl_cleansed_to_conformed_inventory
            base_parameters:
              source_table: "demo_etl.cleansed.inventory_daily"
              target_table: "demo_etl.conformed.fact_inventory_summary"
              aggregation:  "daily_by_warehouse"
              sla:          "06:00 UTC"

      # Pipeline-level tags — used by RCA agent for context
      tags:
        architecture:   "medallion"
        layers:         "raw,cleansed,conformed"
        catalog:        "demo_etl"
        pipeline_owner: "data-engineering"
        schedule:       "nightly 02:00 UTC"
